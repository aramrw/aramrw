name: Metrics
on:
  # Schedule updates daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allows you to manually trigger it from the Actions tab anytime
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Output configuration
          filename: github-metrics.svg
          base: "" # Disables basic account stats so it ONLY generates language stats
          
          # Language Plugin Options
          plugin_languages: yes
          plugin_languages_details: percentage   # Show exact percentage breakdown
          plugin_languages_colors: github        # Match GitHub's official language colors
          plugin_languages_limit: 8              # Display top 8 languages
          plugin_languages_sections: most-used
